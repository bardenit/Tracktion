# Prefer the scheme reported by an upstream proxy (Cloudflare); fall back to the
# scheme of the connection nginx itself received for direct access.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 3000;

    # nginx's 1 MB default was the real upload limit for every path, below the
    # backend's own 20 MB per file: a two-page receipt at 1.03 MB was rejected
    # here with a bare 413 that never reached the API. Sized above six resized
    # receipt pages and above the 20 MB single-file cap, so the backend's own
    # message is what a user who really does send something too big sees.
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend
    location /api {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # An OCR scan against a cold local model can outlast the 60s default,
        # and a service invoice is scanned one page at a time in a single
        # request — six pages at ~5s each, plus a cold load, needs the headroom.
        # Must stay above the client's own 180s ceiling or nginx cuts first.
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    # Vite-hashed assets — filenames change on rebuild, cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker must never be cached
    location = /sw.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # index.html and SPA fallback — always revalidate so updates are picked up immediately
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
